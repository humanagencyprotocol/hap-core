name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  # The same browser check as ci.yml's `browsers` job: the browser entry and the
  # device-keys vectors in WebKit and Chromium. A red run here blocks the publish.
  browsers:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Vectors in WebKit and Chromium
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.58.2
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps webkit chromium
          PLAYWRIGHT_DIR="$RUNNER_TEMP/pw/node_modules/playwright" pnpm test:browsers

  publish:
    needs: browsers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # for npm provenance
    # The test step reads the conformance vectors (spec repo) and a published
    # profile (hap-profiles); without them the vector tests FAIL in CI — the
    # same layout as ci.yml, so a release is tested exactly like a PR.
    env:
      HAP_SPEC_DIR: ${{ github.workspace }}/.hap-protocol/content
      HAP_PROFILES_DIR: ${{ github.workspace }}/.hap-profiles
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout hap-protocol (spec + conformance vectors)
        uses: actions/checkout@v6
        with:
          repository: humanagencyprotocol/hap-protocol
          ref: ec81c52d299046af8a268359c197cb2fdd6026d0
          path: .hap-protocol
          sparse-checkout: content

      - name: Checkout hap-profiles
        uses: actions/checkout@v6
        with:
          repository: humanagencyprotocol/hap-profiles
          path: .hap-profiles

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Upgrade npm
        # Trusted Publishing (OIDC) needs npm 11.5+. Pin to 11.x rather than
        # @latest: npm@latest is now 12.x which requires Node 22+ (EBADENGINE on
        # Node 20), and bleeding-edge npm has broken provenance (missing
        # sigstore). 11.x is stable, Node-20-compatible, and has trusted publishing.
        # Matches hap-linkedin-mcp, which hit this first.
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Publish to npm
        # Trusted Publishing via OIDC — no NPM_TOKEN secret. Requires a Trusted
        # Publisher configured for @humanagencyp/hap-core on npmjs.com pointing
        # at this repo + workflow file (.github/workflows/publish.yml).
        run: npm publish --access public --provenance
